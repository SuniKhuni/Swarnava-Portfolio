# Fly.io — swarnava.xyz. One always-on machine in Mumbai with a 1 GB disk for the content.
# First time: see "Deploy" in README.md (app name, volume, secrets, certificates).

app = "swarnava"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://swarnava.xyz"

[env]
  NEXT_PUBLIC_SITE_URL = "https://swarnava.xyz"
  CONTENT_DIR = "/data"

# Content and /admin uploads: survive deploys and restarts.
[mounts]
  source = "swarnava_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the admin writes to this machine's disk, and visitors never wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
